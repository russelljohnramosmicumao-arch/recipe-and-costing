<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kape' Bar-Rio · Staff Login</title><link rel="stylesheet" href="sync.css"></head><body style="background:#f7f2eb"><main class="cloud-screen"><form id="loginForm" class="cloud-box"><h1>Kape' Bar-Rio</h1><p>Sign in to connect this device to your shop.</p><label for="email">Staff email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p class="cloud-error" id="error" role="alert"></p><button id="signIn">Sign in</button><p><a href="https://russelljohnramosmicumao-arch.github.io/Kape-Barrio/reset-password.html">Reset password</a></p><p style="font-size:13px">Use the staff account created in Supabase Authentication.</p></form></main><script src="sync-config.js"></script><script src="sync-core.js"></script><script>
const loginForm=document.getElementById('loginForm'),loginEmail=document.getElementById('email'),loginPassword=document.getElementById('password'),loginError=document.getElementById('error'),loginSubmit=document.getElementById('signIn');
loginForm.onsubmit=async e=>{e.preventDefault();loginSubmit.disabled=true;loginError.textContent='';try{await KBRCloud.login(loginEmail.value.trim(),loginPassword.value);loginPassword.value='';const wanted=new URLSearchParams(location.search).get('next');location.href=['index.html','menu.html','display.html','manager.html','sales.html'].includes(wanted)?wanted:'index.html';}catch(err){loginError.textContent=err.message;}finally{loginSubmit.disabled=false;}};
</script></body></html>
